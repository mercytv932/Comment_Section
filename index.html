<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment section</title>

  <style>
    #user{
      display: block;
      margin: 10px;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
    }

    #comment{
      display: block;
      margin-top: 5px;
      margin-right: 10px;
      margin-left: 10px;
      border-radius: 10px;
      padding: 10px;
      width: 100%;
    }

    .submit{
      border: 0.5 solid;
      border-radius: 5px;
      padding: 5px;
      background-color:blanchedalmond;
      cursor: pointer;
      margin-left: 15px;
    }
    .submit:hover{
      background-color: rgb(255, 201, 120);
      transition: 0.2s ease-in-out;
      transform: scale(1.07);
      border-color: gray;
    }

    
    #commentsDisplay div{
      border: 0.5px solid;
      padding: 12px;
      margin: 8px;
    }

    #commentsDisplay div:nth-child(odd){
      background-color: aliceblue;
      border-radius: 15px;
    }
    #commentsDisplay div:nth-child(even){
      background-color: lightyellow;
      border-radius: 15px;
      padding: 15px;
      margin: 10px;
    }

    #comment-form{
      margin: 0 auto;
      max-width: 600px;
    }

    .latest-container{
      margin: 0 auto;
      align-items:center ;
      justify-content:center ;
      place-items: center;
    }

    .button{
      background-color: rgb(252, 76, 76);
    }

  </style>
</head>
<body>
<header>
  <nav></nav>
</header>

  <div id="comment-form">
    <input type="text" placeholder="name" id="user" maxlength="50"> <br>
    <textarea name="user_comment" id="comment" placeholder="comment..." maxlength="500"></textarea> <br>
    <button class="submit">Submit</button>
    <div id="commentsDisplay"></div>

</div>

  <div class="latest-container">

    <!-- <h3>Latest comments</h3> -->
    <div id="latestComment"></div>

  </div>


  <script src="script.js"></script>
</body>
</html>
